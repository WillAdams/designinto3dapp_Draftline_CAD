<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Draftline Blocks</title>
  <script src="https://unpkg.com/blockly@11.2.2/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@11.2.2/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly@11.2.2/msg/en.js"></script>
  <style>
    html, body, #blocklyDiv { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>
  <xml id="toolbox" style="display: none">
    <category name="Drawing setup" colour="#536dfe">
      <block type="units"></block>
      <block type="layer"></block>
      <block type="plane"></block>
    </category>
    <category name="Geometry" colour="#009688">
      <block type="line"></block>
      <block type="circle"></block>
      <block type="arc"></block>
    </category>
    <category name="Notes" colour="#8e7cc3">
      <block type="comment"></block>
    </category>
  </xml>
  <script>
    const definitions = {
      units: { label: "UNITS", colour: 195, fields: [["unit", "unit", "mm"]] },
      layer: { label: "LAYER", colour: 210, fields: [["name", "name", "0"], ["color", "color (ACI/name)", "7"]] },
      plane: { label: "PLANE", colour: 225, fields: [["name", "name", "XY"], ["origin", "origin x,y,z", "0,0,0"], ["u", "u axis", "1,0,0"], ["v", "v axis", "0,1,0"]] },
      line: { label: "LINE", colour: 135, fields: [["name", "name", "line-1"], ["from", "from x,y", "0,0"], ["to", "to x,y", "10,0"], ["plane", "plane", "XY"], ["rotate", "rotate°", "0"], ["offset", "offset", "0"], ["layer", "layer", "0"], ["color", "color / bylayer", "bylayer"]] },
      circle: { label: "CIRCLE", colour: 155, fields: [["name", "name", "circle-1"], ["center", "center x,y", "0,0"], ["radius", "radius", "5"], ["plane", "plane", "XY"], ["rotate", "rotate°", "0"], ["offset", "offset", "0"], ["layer", "layer", "0"], ["color", "color / bylayer", "bylayer"]] },
      arc: { label: "ARC", colour: 175, fields: [["name", "name", "arc-1"], ["center", "center x,y", "0,0"], ["radius", "radius", "5"], ["start", "start°", "0"], ["end", "end°", "90"], ["plane", "plane", "XY"], ["rotate", "rotate°", "0"], ["offset", "offset", "0"], ["layer", "layer", "0"], ["color", "color / bylayer", "bylayer"]] },
      comment: { label: "NOTE", colour: 260, fields: [["text", "#", "Drawing note"]] }
    };

    for (const [type, spec] of Object.entries(definitions)) {
      Blockly.Blocks[type] = {
        init() {
          this.appendDummyInput().appendField(spec.label);
          for (const [key, label, initial] of spec.fields) {
            this.appendDummyInput().appendField(label).appendField(new Blockly.FieldTextInput(initial), key);
          }
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(spec.colour);
          this.setTooltip(type === "plane" ? "Define a local drawing plane using an origin and two axes." : "Edit the DSL fields directly in this block.");
        }
      };
    }

    const workspace = Blockly.inject("blocklyDiv", {
      toolbox: document.getElementById("toolbox"),
      trashcan: true,
      scrollbars: true,
      move: { scrollbars: true, drag: true, wheel: true },
      zoom: { controls: true, wheel: true, startScale: 0.78, maxScale: 1.35, minScale: 0.45 }
    });

    function clean(value) {
      return String(value ?? "").trim().replace(/\s+/g, "_");
    }

    function blockLine(block) {
      if (block.type === "comment") return "# " + String(block.getFieldValue("text") || "").trim();
      if (block.type === "units") return "UNITS " + clean(block.getFieldValue("unit"));
      if (block.type === "layer") return `LAYER name=${clean(block.getFieldValue("name"))} color=${clean(block.getFieldValue("color"))}`;
      if (block.type === "plane") {
        return `PLANE ${clean(block.getFieldValue("name"))} origin=${clean(block.getFieldValue("origin"))} u=${clean(block.getFieldValue("u"))} v=${clean(block.getFieldValue("v"))}`;
      }
      const fields = definitions[block.type].fields.map(([key]) => [key, clean(block.getFieldValue(key))]);
      return block.type.toUpperCase() + " " + fields.map(([key, value]) => `${key}=${value}`).join(" ");
    }

    function generateDsl() {
      const lines = [];
      for (const top of workspace.getTopBlocks(true)) {
        for (let block = top; block; block = block.getNextBlock()) lines.push(blockLine(block));
      }
      return lines.join("\n") + (lines.length ? "\n" : "");
    }

    let emitTimer = null;
    workspace.addChangeListener((event) => {
      if (event.isUiEvent) return;
      clearTimeout(emitTimer);
      emitTimer = setTimeout(() => {
        const code = encodeURIComponent(generateDsl());
        window.location.href = "draftline://dsl?code=" + code;
      }, 180);
    });

    function params(tokens) {
      const result = {};
      for (const token of tokens) {
        const index = token.indexOf("=");
        if (index > 0) result[token.slice(0, index).toLowerCase()] = token.slice(index + 1);
      }
      return result;
    }

    function createBlock(type, values) {
      const block = workspace.newBlock(type);
      for (const [key, value] of Object.entries(values)) {
        if (block.getField(key)) block.setFieldValue(String(value), key);
      }
      block.initSvg();
      block.render();
      return block;
    }

    window.loadDsl = function(source) {
      Blockly.Events.disable();
      try {
        workspace.clear();
        let previous = null;
        for (const original of String(source || "").split(/\r?\n/)) {
          const trimmed = original.trim();
          if (!trimmed) continue;
          let type;
          let values = {};
          if (trimmed.startsWith("#")) {
            type = "comment";
            values.text = trimmed.slice(1).trim();
          } else {
            const tokens = trimmed.split(/\s+/);
            const command = tokens[0].toUpperCase();
            if (command === "UNITS") { type = "units"; values.unit = tokens[1] || "mm"; }
            else if (command === "LAYER") { type = "layer"; values = params(tokens.slice(1)); }
            else if (command === "PLANE") { type = "plane"; values = params(tokens.slice(2)); values.name = tokens[1] || "XY"; }
            else if (["LINE", "CIRCLE", "ARC"].includes(command)) { type = command.toLowerCase(); values = params(tokens.slice(1)); }
            else { throw new Error("Unsupported DSL command: " + command); }
          }
          const block = createBlock(type, values);
          if (previous) previous.nextConnection.connect(block.previousConnection);
          previous = block;
        }
        workspace.getAllBlocks(false).forEach((block) => block.render());
      } finally {
        Blockly.Events.enable();
      }
    };

    window.setBlockTheme = function(mode) {
      if (!workspace.setTheme || !Blockly.Themes) return;
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const dark = mode === "dark" || (mode === "system" && systemDark);
      const theme = dark && Blockly.Themes.Dark ? Blockly.Themes.Dark : Blockly.Themes.Classic;
      if (theme) workspace.setTheme(theme);
    };

    window.setBlockTheme("system");
  </script>
</body>
</html>
